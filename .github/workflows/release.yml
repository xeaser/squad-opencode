name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or retry (e.g. v0.5.1)
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use default-branch GoReleaser config
        run: |
          git fetch origin main
          git show origin/main:.goreleaser.yaml > "${RUNNER_TEMP}/goreleaser.yaml"
      - name: Require tag commit on origin/main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${RELEASE_TAG} (${GITHUB_SHA}) is not on origin/main; refusing to release"
            exit 1
          fi
      - name: Require previous stable tag has a GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          git show origin/main:scripts/require-previous-release.sh > "${RUNNER_TEMP}/require-previous-release.sh"
          bash "${RUNNER_TEMP}/require-previous-release.sh" "${RELEASE_TAG}"
      - name: Wait for ci on tagged commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          deadline=$((SECONDS + 1200))
          while true; do
            json=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci.yml --limit 1 --json databaseId,status,conclusion)
            id=$(printf '%s\n' "$json" | jq -r '.[0].databaseId // empty')
            status=$(printf '%s\n' "$json" | jq -r '.[0].status // empty')
            conclusion=$(printf '%s\n' "$json" | jq -r '.[0].conclusion // empty')
            if [ -n "$id" ] && [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "ci run $id succeeded"
                exit 0
              fi
              echo "::error::ci run $id on ${GITHUB_SHA} concluded ${conclusion}; refusing to release"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for ci on ${GITHUB_SHA}"
              exit 1
            fi
            if [ -n "$id" ]; then
              remaining=$((deadline - SECONDS))
              echo "ci run $id is ${status}; watching (up to ${remaining}s)"
              timeout "${remaining}s" gh run watch "$id" --exit-status || true
              continue
            fi
            echo "no ci run yet for ${GITHUB_SHA}; sleeping 15s"
            sleep 15
          done
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --config ${{ runner.temp }}/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload dist for packaging bump
        uses: actions/upload-artifact@v4
        with:
          name: packaging-dist
          path: dist
          if-no-files-found: error

  packaging-bump:
    needs: [goreleaser]
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: packaging-dist
          path: dist
      - name: Copy packaging from dist
        env:
          DIST: dist
          REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        run: bash scripts/copy-packaging-from-dist.sh
      - name: Open bump PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          newest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ "${TAG}" != "${newest}" ]; then
            echo "tag ${TAG} is not the newest stable tag (${newest}); skip packaging pin"
            exit 0
          fi
          git add Casks/squad-oc.rb bucket/squad-oc.json packaging/winget tap_migrations.json
          git add -u Formula || true
          if git diff --cached --quiet; then
            echo "no packaging changes"
            exit 0
          fi
          branch="chore/packaging-${TAG}"
          headline="chore: pin Homebrew, Scoop, and winget to ${TAG}"
          oid=$(git rev-parse HEAD)
          additions='[]'
          deletions='[]'
          while IFS=$'\t' read -r status path; do
            case "${status}" in
              D)
                deletions=$(jq -c --arg p "${path}" '. + [{path:$p}]' <<<"${deletions}")
                ;;
              *)
                additions=$(jq -c --arg p "${path}" --arg c "$(base64 -w0 "${path}")" '. + [{path:$p,contents:$c}]' <<<"${additions}")
                ;;
            esac
          done < <(git diff --cached --name-status)
          if ! gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" -f sha="${oid}" -F force=true >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${branch}" -f sha="${oid}" >/dev/null
          fi
          gh api graphql -f query='
            mutation($repo:String!,$branch:String!,$oid:GitObjectID!,$headline:String!,$additions:[FileAddition!]!,$deletions:[FileDeletion!]!) {
              createCommitOnBranch(input:{
                branch:{repositoryNameWithOwner:$repo,branchName:$branch}
                expectedHeadOid:$oid
                message:{headline:$headline}
                fileChanges:{additions:$additions,deletions:$deletions}
              }) { commit { oid } }
            }' \
            -f repo="${GITHUB_REPOSITORY}" \
            -f branch="${branch}" \
            -f oid="${oid}" \
            -f headline="${headline}" \
            -F additions="${additions}" \
            -F deletions="${deletions}"
          pr=$(gh pr list --head "${branch}" --json number --jq '.[0].number // empty')
          if [ -z "${pr}" ]; then
            gh pr create --base main --head "${branch}" \
              --title "${headline}" \
              --body "Auto-generated from ${TAG}. Approve and squash-merge when ci is green. Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            pr=$(gh pr list --head "${branch}" --json number --jq '.[0].number // empty')
          fi
          if [ -z "${pr}" ]; then
            echo "::error::could not open packaging PR; branch ${branch} exists"
            exit 1
          fi
          gh workflow run ci.yml --ref "${branch}"
