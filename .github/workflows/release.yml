name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag commit on origin/main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on origin/main; refusing to release"
            exit 1
          fi
      - name: Wait for ci on tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          deadline=$((SECONDS + 1200))
          while true; do
            json=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --workflow ci.yml --limit 1 --json databaseId,status,conclusion)
            id=$(printf '%s\n' "$json" | jq -r '.[0].databaseId // empty')
            status=$(printf '%s\n' "$json" | jq -r '.[0].status // empty')
            conclusion=$(printf '%s\n' "$json" | jq -r '.[0].conclusion // empty')
            if [ -n "$id" ] && [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "ci run $id succeeded"
                exit 0
              fi
              echo "::error::ci run $id on ${GITHUB_SHA} concluded ${conclusion}; refusing to release"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for ci on ${GITHUB_SHA}"
              exit 1
            fi
            if [ -n "$id" ]; then
              remaining=$((deadline - SECONDS))
              echo "ci run $id is ${status}; watching (up to ${remaining}s)"
              timeout "${remaining}s" gh run watch "$id" --exit-status || true
              continue
            fi
            echo "no ci run yet for ${GITHUB_SHA}; sleeping 15s"
            sleep 15
          done
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload dist for packaging bump
        uses: actions/upload-artifact@v4
        with:
          name: packaging-dist
          path: dist
          if-no-files-found: error

  packaging-bump:
    needs: [goreleaser]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require bump token
        env:
          PACKAGING_BUMP_TOKEN: ${{ secrets.PACKAGING_BUMP_TOKEN }}
        run: |
          if [ -z "${PACKAGING_BUMP_TOKEN}" ]; then
            echo "::error::set repository secret PACKAGING_BUMP_TOKEN (contents + pull-requests) so the bump PR can run ci"
            exit 1
          fi
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PACKAGING_BUMP_TOKEN }}
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: packaging-dist
          path: dist
      - name: Copy packaging from dist
        env:
          DIST: dist
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/copy-packaging-from-dist.sh
      - name: Open bump PR
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_BUMP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="chore/packaging-${TAG}"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add Casks/squad-oc.rb bucket/squad-oc.json packaging/winget tap_migrations.json
          git add -u Formula || true
          if git diff --cached --quiet; then
            echo "no packaging changes"
            exit 0
          fi
          git commit -m "chore: pin Homebrew, Scoop, and winget to ${TAG}"
          git push -u origin "${branch}" --force
          pr=$(gh pr list --head "${branch}" --json number --jq '.[0].number')
          if [ -z "${pr}" ] || [ "${pr}" = "null" ]; then
            gh pr create --base main --head "${branch}" \
              --title "chore: pin Homebrew, Scoop, and winget to ${TAG}" \
              --body "Auto-generated from ${TAG}. Approve to squash-merge when ci is green. Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            pr=$(gh pr list --head "${branch}" --json number --jq '.[0].number')
          fi
          gh pr merge --squash --auto "${pr}"
