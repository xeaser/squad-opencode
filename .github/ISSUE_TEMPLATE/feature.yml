name: Feature request
description: A change to squad-oc behavior or docs
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check [CONTRIBUTING.md](https://github.com/xeaser/squad-opencode/blob/master/CONTRIBUTING.md) non-goals before asking for Copilot, Ink shell, Aspire, or npm.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should squad-oc do? Command and flag names if you have them.
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: Original Squad analog
      description: If this matches a `squad` command, name it. Leave blank if new.
