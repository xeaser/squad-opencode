version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      - linters: [errcheck]
        text: "Error return value of `.*\\.Close` is not checked"
      - linters: [errcheck]
        text: "Error return value of `os\\.Remove(All)?` is not checked"
