run:
  timeout: 4m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-use-default: false
  exclude-rules:
    - linters: [errcheck]
      text: "Error return value of `.*\\.Close` is not checked"
    - linters: [errcheck]
      text: "Error return value of `os\\.Remove(All)?` is not checked"
